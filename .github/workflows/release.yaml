name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify tag matches Maven version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pom_version="$(mvn --quiet --batch-mode --no-transfer-progress \
            -DforceStdout \
            -Dexpression=project.version \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate)"

          if [[ "${tag_version}" != "${pom_version}" ]]; then
            echo "Tag version ${tag_version} does not match pom.xml version ${pom_version}." >&2
            exit 1
          fi

      - name: Run verification tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build source and Javadoc JARs
        run: |
          mvn --batch-mode --no-transfer-progress \
            -DskipTests \
            org.apache.maven.plugins:maven-source-plugin:3.3.1:jar-no-fork \
            org.apache.maven.plugins:maven-javadoc-plugin:3.12.0:jar

      - name: Create draft GitHub Release for manual review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "Select AI for Java ${version}" \
            --generate-notes \
            "target/select-ai-java-${version}.jar" \
            "target/select-ai-java-${version}-sources.jar" \
            "target/select-ai-java-${version}-javadoc.jar"
