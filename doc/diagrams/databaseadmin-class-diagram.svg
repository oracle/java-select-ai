  <rect x="1770" y="815" width="500" height="52" rx="8" fill="#e8edf5" stroke="#334155" stroke-width="3"/>
  <path d="M 1770 867 H 2270" stroke="#334155" stroke-width="3"/>
  <text x="2020" y="849" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#243244">DbConnectionConfig</text>
  <text x="1798" y="899" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">connection input</text>
  <text x="1798" y="931" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- jdbcUrl : String</text>
  <text x="1798" y="959" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- dbUser : String</text>
  <text x="1798" y="987" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- dbPassword : String</text>
  <text x="1798" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- jdbcProperties : Properties</text>
</g>

