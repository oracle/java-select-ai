<!-- Sql -->
<g>
  <rect x="1770" y="1168" width="600" height="202" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="1770" y="1168" width="600" height="52" rx="8" fill="#e8edf5" stroke="#334155" stroke-width="3"/>
  <path d="M 1770 1220 H 2370" stroke="#334155" stroke-width="3"/>
  <text x="2070" y="1202" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#243244">Sql</text>
  <text x="1798" y="1252" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">ENABLE_DATA_ACCESS / DISABLE_DATA_ACCESS</text>
  <text x="1798" y="1280" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">GRANT_HTTP_ACCESS_PRIVILEGES / REVOKE_HTTP_ACCESS_PRIVILEGES</text>
  <text x="1798" y="1308" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">GRANT_NETWORK_ACCESS_ACL / REVOKE_NETWORK_ACCESS_ACL</text>
</g>

<!-- Notes -->
<g>
  <rect x="60" y="1215" width="1260" height="132" rx="8" fill="#fff8dd" stroke="#d59b22" stroke-width="2"/>
  <text x="88" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">Use DatabaseAdmin only from setup/admin workflows with users authorized for privilege, data-access, or ACL changes.</text>
  <text x="88" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">DbConnectionConfig mode owns one JDBC connection; DataSource mode borrows one connection per operation.</text>
</g>
