  <text x="1118" y="957" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ withConnection(callback) : T</text>
  <path d="M 1090 987 H 1590" stroke="#b8c4d4" stroke-width="2"/>
