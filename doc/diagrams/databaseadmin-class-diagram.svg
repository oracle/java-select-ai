</defs>
<rect x="0" y="0" width="2500" height="1500" fill="#ffffff"/>
<text x="60" y="60" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2937">DatabaseAdmin Class Diagram</text>
<text x="60" y="96" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5b6472">Focused view of privileged Select AI administrative operations</text>

