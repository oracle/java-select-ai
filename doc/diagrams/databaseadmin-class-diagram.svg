  <text x="1118" y="1047" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">DataSourceConnectionProvider</text>
</g>

<!-- DataSource / Options -->
<g>
  <rect x="1770" y="300" width="500" height="248" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="1770" y="300" width="500" height="52" rx="8" fill="#e8edf5" stroke="#334155" stroke-width="3"/>
  <path d="M 1770 352 H 2270" stroke="#334155" stroke-width="3"/>
  <text x="2020" y="334" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#243244">Supporting Types</text>
  <text x="1798" y="386" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">DataSource</text>
  <text x="1798" y="414" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">SelectAIOptions</text>
  <text x="1798" y="442" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">DbConnection</text>
