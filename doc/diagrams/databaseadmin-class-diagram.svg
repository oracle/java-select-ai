<!-- DatabaseAdmin -->
<g>
  <rect x="60" y="160" width="770" height="560" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="60" y="160" width="770" height="70" rx="8" fill="#dfe7f1" stroke="#334155" stroke-width="3"/>
  <path d="M 60 230 H 830" stroke="#334155" stroke-width="3"/>
  <text x="445" y="192" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#243244">DatabaseAdmin</text>
  <text x="445" y="219" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#243244">&lt;&lt;interface&gt;&gt; extends AutoCloseable</text>

  <text x="88" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">client creation and lifecycle</text>
  <text x="88" y="292" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DbConnectionConfig) : DatabaseAdmin</text>
  <text x="88" y="320" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DbConnectionConfig, SelectAIOptions) : DatabaseAdmin</text>
  <text x="88" y="348" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DataSource) : DatabaseAdmin</text>
  <text x="88" y="376" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DataSource, SelectAIOptions) : DatabaseAdmin</text>
  <text x="88" y="404" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ close() : void</text>

  <path d="M 60 434 H 830" stroke="#b8c4d4" stroke-width="2"/>
  <text x="88" y="464" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">privileged operations</text>
  <text x="88" y="496" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ enableDataAccess() : boolean</text>
  <text x="88" y="524" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ disableDataAccess() : boolean</text>
  <text x="88" y="552" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ grantPrivileges(List&lt;String&gt;) : boolean</text>
  <text x="88" y="580" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ revokePrivileges(List&lt;String&gt;) : boolean</text>
  <text x="88" y="608" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ grantHttpAccess(List&lt;String&gt;, String) : boolean</text>
  <text x="88" y="636" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ revokeHttpAccess(List&lt;String&gt;, String) : boolean</text>
  <text x="88" y="664" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ grantNetworkAccess(...) : boolean</text>
  <text x="88" y="692" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ revokeNetworkAccess(...) : boolean</text>
</g>

<!-- DefaultDatabaseAdmin -->
<g>
  <rect x="1090" y="250" width="500" height="432" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="1090" y="250" width="500" height="52" rx="8" fill="#dfe7f1" stroke="#334155" stroke-width="3"/>
  <path d="M 1090 302 H 1590" stroke="#334155" stroke-width="3"/>
  <text x="1340" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#243244">DefaultDatabaseAdmin (internal)</text>
  <text x="1118" y="334" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">fields</text>
  <text x="1118" y="366" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- dbConnection : DbConnection</text>
  <text x="1118" y="394" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- connectionProvider : ConnectionProvider</text>
  <path d="M 1090 424 H 1590" stroke="#b8c4d4" stroke-width="2"/>
  <text x="1118" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">constructors</text>
  <text x="1118" y="488" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">~ DefaultDatabaseAdmin(DbConnectionConfig)</text>
  <text x="1118" y="516" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">~ DefaultDatabaseAdmin(DbConnectionConfig, SelectAIOptions)</text>
  <text x="1118" y="544" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">~ DefaultDatabaseAdmin(DataSource)</text>
  <text x="1118" y="572" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">~ DefaultDatabaseAdmin(DataSource, SelectAIOptions)</text>
  <path d="M 1090 602 H 1590" stroke="#b8c4d4" stroke-width="2"/>
  <text x="1118" y="634" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ close() : void</text>
  <text x="1118" y="662" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ admin operation implementations</text>
</g>

<!-- DbConnectionConfig -->
