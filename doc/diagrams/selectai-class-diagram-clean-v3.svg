<rect x="0" y="0" width="3200" height="1700" fill="#ffffff"/>
<text x="55" y="55" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1f2937">SelectAI Class Diagram</text>
<text x="55" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5b6472">Clean focused view of the current com.oracle.database.selectai SelectAI and DatabaseAdmin APIs</text>

