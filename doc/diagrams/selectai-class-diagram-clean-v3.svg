<!-- Notes -->
<g>
  <rect x="2070" y="1065" width="760" height="136" rx="8" fill="#fff8dd" stroke="#d59b22" stroke-width="2"/>
  <text x="2094" y="1106" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">Feedback, summarize, and synthetic-data operations are Profile-scoped.</text>
  <text x="2094" y="1134" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">SelectAI opens/configures resources. DatabaseAdmin manages grants/data access.</text>
  <text x="2094" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">Factory methods return in-memory objects for create paths; call create() where applicable.</text>
</g>

<g>
  <rect x="1120" y="1450" width="1280" height="118" rx="8" fill="#fff8dd" stroke="#d59b22" stroke-width="2"/>
  <text x="1146" y="1492" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">DbConnectionConfig mode owns one JDBC connection. DataSource mode borrows a connection for each operation.</text>
  <text x="1146" y="1520" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7c4a03">SelectAIOptions applies SDK statement options such as query timeout.</text>
</g>
</svg>
