  <text x="465" y="879" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#243244">&lt;&lt;interface&gt;&gt; extends AutoCloseable</text>

  <text x="92" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">client creation and lifecycle</text>
  <text x="92" y="948" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DbConnectionConfig[, SelectAIOptions]) : DatabaseAdmin</text>
  <text x="92" y="976" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DataSource[, SelectAIOptions]) : DatabaseAdmin</text>
  <text x="92" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ close() : void</text>

  <path d="M 70 1034 H 860" stroke="#b8c4d4" stroke-width="2"/>
  <text x="92" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">administrative operations</text>
  <text x="92" y="1092" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ enableDataAccess() / disableDataAccess() : boolean</text>
  <text x="92" y="1120" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ grantPrivileges(...) / revokePrivileges(...) : boolean</text>
  <text x="92" y="1148" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ grantNetworkAccess(...) / revokeNetworkAccess(...) : boolean</text>
</g>

<!-- DefaultSelectAI -->
<g>
