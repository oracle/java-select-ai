<!-- SelectAI -->
<g>
  <rect x="70" y="150" width="790" height="610" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="70" y="150" width="790" height="70" rx="8" fill="#dfe7f1" stroke="#334155" stroke-width="3"/>
  <path d="M 70 220 H 860" stroke="#334155" stroke-width="3"/>
  <text x="465" y="182" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#243244">SelectAI</text>
  <text x="465" y="209" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#243244">&lt;&lt;interface&gt;&gt; extends AutoCloseable</text>

  <text x="92" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">client creation and lifecycle</text>
  <text x="92" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DbConnectionConfig[, SelectAIOptions]) : SelectAI</text>
  <text x="92" y="306" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ create(DataSource[, SelectAIOptions]) : SelectAI</text>
  <text x="92" y="334" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ close() : void</text>
  <text x="92" y="362" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ getConnection() : Connection</text>

  <path d="M 70 392 H 860" stroke="#b8c4d4" stroke-width="2"/>
  <text x="92" y="420" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">resources and collections</text>
  <text x="92" y="450" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ credential(CredentialConfig) : Credential</text>
  <text x="92" y="478" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ profile(String) : Profile</text>
  <text x="92" y="506" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ profile(String, ProfileAttributes, String, ProfileStatus) : Profile</text>
  <text x="92" y="534" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ listProfiles() : List&lt;Profile&gt;</text>
  <text x="92" y="562" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ listProfiles(String) : List&lt;Profile&gt;</text>
  <text x="92" y="590" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ vectorIndex(String) : VectorIndex</text>
  <text x="92" y="618" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ vectorIndex(VectorIndexConfig) : VectorIndex</text>
  <text x="92" y="646" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ listVectorIndexes() : List&lt;VectorIndex&gt;</text>
  <text x="92" y="674" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ listVectorIndexes(String) : List&lt;VectorIndex&gt;</text>
  <text x="92" y="702" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ conversation(ConversationAttributes) : Conversation</text>
  <text x="92" y="730" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ conversation(String) : Conversation</text>
  <text x="92" y="758" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">+ listConversations() : List&lt;Conversation&gt;</text>
</g>

<!-- DatabaseAdmin -->
