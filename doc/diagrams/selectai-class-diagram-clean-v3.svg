  <text x="1145" y="442" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#64748b">fields</text>
  <text x="1145" y="472" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243244">- dbConnectionConfig : DbConnectionConfig</text>
