    <text x="1550.0" y="469" class="name" text-anchor="middle">TaskAttributes</text>
    <text x="1550.0" y="498" class="stereo" text-anchor="middle">&lt;&lt;immutable configuration; builder&gt;&gt;</text>
    <text x="1126" y="551" class="member" text-anchor="start">instruction : String</text>
    <text x="1126" y="582" class="member" text-anchor="start">tools : List&lt;String&gt;</text>
    <text x="1126" y="613" class="member" text-anchor="start">input : List&lt;String&gt;</text>
    <text x="1126" y="644" class="member" text-anchor="start">enableHumanTool : Boolean</text>
    <text x="1126" y="691" class="note" text-anchor="start">tools lists tool names; input lists upstream task names.</text>
    <text x="1126" y="717" class="note" text-anchor="start">TeamAttributes.TeamMember pairs each worker with a task.</text>
    <text x="1126" y="743" class="note" text-anchor="start">Resource enablement is separate from team execution state.</text>
  </g>
