  <path d="M510 725 V785" class="dependency" />
  <text x="560" y="765" class="label" text-anchor="middle">uses</text>
  <line x1="60" x2="2000" y1="1004" y2="1004" stroke="#cbd5e1" />
  <text x="60" y="1038" class="note" text-anchor="start">JDBC/database failures: SelectAIException. Invalid input/state: IllegalArgumentException / IllegalStateException.</text>
  <text x="60" y="1065" class="note" text-anchor="start">drop(true) delegates missing-resource handling to the database, including repeated forced drops.</text>
  <text x="60" y="1092" class="note" text-anchor="start">Dashed triangle: implementation points to its interface. Dashed arrow: dependency. Exception clauses omitted.</text>
