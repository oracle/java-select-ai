  <rect width="2060" fill="#fff" height="1142" />
  <text x="1030.0" y="50" class="title" text-anchor="middle">Task Class Diagram</text>
  <text x="1030.0" y="82" class="subtitle" text-anchor="middle">com.oracle.database.selectai.agent.Task | complete public method signatures</text>
  <g class="node" data-name="Task">
