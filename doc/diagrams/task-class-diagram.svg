    <text x="1550.0" y="174" class="name" text-anchor="middle">DefaultTask</text>
    <text x="1550.0" y="203" class="stereo" text-anchor="middle">&lt;&lt;package-private, final implementation&gt;&gt;</text>
    <text x="1126" y="256" class="note" text-anchor="start">Implements Task; constructors are package-private.</text>
    <text x="1126" y="287" class="note" text-anchor="start">Created through SelectAIAgent resource factories.</text>
    <text x="1126" y="318" class="note" text-anchor="start">Uses ConnectionProvider, AgentJdbc, and AgentSql.</text>
  </g>
  <path d="M1100 235 H960" class="realization" />
  <text x="1030" y="218" class="label" text-anchor="middle">implements</text>
