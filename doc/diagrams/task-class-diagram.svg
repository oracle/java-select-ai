    <text x="86" y="256" class="member" text-anchor="start">+ create() : boolean</text>
    <text x="86" y="287" class="member" text-anchor="start">+ enable() : boolean</text>
    <text x="86" y="318" class="member" text-anchor="start">+ disable() : boolean</text>
    <text x="86" y="349" class="member" text-anchor="start">+ drop(boolean) : boolean</text>
    <text x="86" y="380" class="member" text-anchor="start">+ setAttribute(String, String) : boolean</text>
    <text x="86" y="411" class="member" text-anchor="start">+ setAttribute(String, boolean) : boolean</text>
    <text x="86" y="442" class="member" text-anchor="start">+ setAttribute(String, Integer) : boolean</text>
    <text x="86" y="473" class="member" text-anchor="start">+ setAttribute(String, Float) : boolean</text>
    <text x="86" y="504" class="member" text-anchor="start">+ setAttributes(TaskAttributes) : boolean</text>
    <text x="86" y="535" class="member" text-anchor="start">+ getTaskName() : String</text>
    <text x="86" y="566" class="member" text-anchor="start">+ getDescription() : String</text>
    <text x="86" y="597" class="member" text-anchor="start">+ getStatus() : TaskStatus</text>
    <text x="86" y="628" class="member" text-anchor="start">+ getTaskAttributes() : TaskAttributes</text>
    <text x="86" y="675" class="note" text-anchor="start">agentClient.task(name) loads an owned resource.</text>
    <text x="86" y="701" class="note" text-anchor="start">The attributes overload configures a handle; create() persists it.</text>
  </g>
  <g class="node" data-name="DefaultTask">
