<svg xmlns="http://www.w3.org/2000/svg" width="2500" role="img" aria-labelledby="title desc" height="1423" viewBox="0 0 2500 1423">
  <title id="title">Agent Resource Relationships</title>
  <desc id="desc">Owned resources, name-based relationships, and current request/result models | method families summarized</desc>
  <defs>
    <style>
            .title {font:700 32px Arial,sans-serif;fill:#17212b}
            .subtitle {font:18px Arial,sans-serif;fill:#475569}
            .box {fill:#fafbfc;stroke:#475569;stroke-width:2}
            .header {fill:#e6edf3}
            .name {font:700 23px Arial,sans-serif;fill:#17212b}
            .stereo,.note,.label {font:18px Arial,sans-serif;fill:#374151}
            .member {font:18px Menlo,Consolas,monospace;fill:#17212b;white-space:pre}
            .section {font:700 18px Arial,sans-serif;fill:#18665c}
            .dependency {fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
            .realization {fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#triangle)}
            .inheritance {fill:none;stroke:#475569;stroke-width:2;marker-end:url(#triangle)}
            .association {fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
        </style>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#475569" stroke-width="2" />
    </marker>
    <marker id="triangle" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M17,9 L1,1 L1,17 Z" fill="#fff" stroke="#475569" stroke-width="2" />
    </marker>
  </defs>
  <rect width="2500" fill="#fff" height="1423" />
  <text x="1250.0" y="50" class="title" text-anchor="middle">Agent Resource Relationships</text>
  <text x="1250.0" y="82" class="subtitle" text-anchor="middle">Owned resources, name-based relationships, and current request/result models | method families summarized</text>
  <g class="node" data-name="Team">
    <rect x="60" y="140" width="820" height="585" rx="6" class="box" />
    <rect x="61" y="141" width="818" height="82" rx="5" class="header" />
    <line x1="60" y1="223" x2="880" y2="223" stroke="#475569" stroke-width="2" />
    <text x="470.0" y="174" class="name" text-anchor="middle">Team</text>
    <text x="470.0" y="203" class="stereo" text-anchor="middle">&lt;&lt;owner-scoped interface&gt;&gt;</text>
    <text x="86" y="256" class="member" text-anchor="start">+ create / enable / disable / drop : boolean</text>
    <text x="86" y="287" class="member" text-anchor="start">+ setAttribute / setAttributes : boolean</text>
    <text x="86" y="318" class="member" text-anchor="start">+ grantAccess / revokeAccess : boolean</text>
    <text x="86" y="349" class="member" text-anchor="start">+ run(RunTeamRequest) : TeamRunResult</text>
    <text x="86" y="380" class="member" text-anchor="start">+ describe() : TeamDescription</text>
    <text x="86" y="411" class="member" text-anchor="start">+ getStateByConversationId(String)</text>
    <text x="86" y="442" class="member" text-anchor="start">    : TeamExecutionState</text>
    <text x="86" y="473" class="member" text-anchor="start">+ setExecutionState(ExecutionStateRequest)</text>
    <text x="86" y="504" class="member" text-anchor="start">    : boolean</text>
    <text x="86" y="535" class="member" text-anchor="start">+ exportDefinition() : String</text>
    <text x="86" y="566" class="member" text-anchor="start">+ exportDefinition(ExportTeamParams) : String</text>
    <text x="86" y="597" class="member" text-anchor="start">+ exportDefinition(ExportTeamRequest) : boolean</text>
    <text x="86" y="628" class="member" text-anchor="start">+ name / description / status / attributes getters</text>
    <text x="86" y="675" class="note" text-anchor="start">TeamAttributes.agents contains worker agent/task pairs.</text>
    <text x="86" y="701" class="note" text-anchor="start">supervisorAgent separately names a supervisor agent.</text>
  </g>
  <g class="node" data-name="Agent">
    <rect x="1060" y="140" width="640" height="399" rx="6" class="box" />
    <rect x="1061" y="141" width="638" height="82" rx="5" class="header" />
    <line x1="1060" y1="223" x2="1700" y2="223" stroke="#475569" stroke-width="2" />
    <text x="1380.0" y="174" class="name" text-anchor="middle">Agent</text>
    <text x="1380.0" y="203" class="stereo" text-anchor="middle">&lt;&lt;owner-scoped interface&gt;&gt;</text>
    <text x="1086" y="256" class="member" text-anchor="start">+ create / enable / disable / drop</text>
    <text x="1086" y="287" class="member" text-anchor="start">+ setAttribute / setAttributes</text>
    <text x="1086" y="318" class="member" text-anchor="start">+ name / description / status / attributes</text>
    <text x="1086" y="349" class="section" text-anchor="start">AgentAttributes</text>
    <text x="1086" y="380" class="member" text-anchor="start">profileName / role / tools</text>
    <text x="1086" y="411" class="member" text-anchor="start">enableHumanTool / supervisor</text>
    <text x="1086" y="442" class="member" text-anchor="start">shortTermMemoryLength</text>
    <text x="1086" y="489" class="note" text-anchor="start">supervisor(true) marks the supervisor role.</text>
    <text x="1086" y="515" class="note" text-anchor="start">TeamAttributes selects that agent by name.</text>
  </g>
  <g class="node" data-name="Task">
    <rect x="1060" y="740" width="640" height="342" rx="6" class="box" />
    <rect x="1061" y="741" width="638" height="82" rx="5" class="header" />
    <line x1="1060" y1="823" x2="1700" y2="823" stroke="#475569" stroke-width="2" />
    <text x="1380.0" y="774" class="name" text-anchor="middle">Task</text>
    <text x="1380.0" y="803" class="stereo" text-anchor="middle">&lt;&lt;owner-scoped interface&gt;&gt;</text>
    <text x="1086" y="856" class="member" text-anchor="start">+ create / enable / disable / drop</text>
    <text x="1086" y="887" class="member" text-anchor="start">+ setAttribute / setAttributes</text>
    <text x="1086" y="918" class="member" text-anchor="start">+ name / description / status / attributes</text>
    <text x="1086" y="949" class="section" text-anchor="start">TaskAttributes</text>
    <text x="1086" y="980" class="member" text-anchor="start">instruction / tools / input</text>
    <text x="1086" y="1011" class="member" text-anchor="start">enableHumanTool</text>
    <text x="1086" y="1058" class="note" text-anchor="start">TeamMember associates a task with a worker.</text>
  </g>
  <g class="node" data-name="Tool">
    <rect x="1880" y="450" width="560" height="404" rx="6" class="box" />
    <rect x="1881" y="451" width="558" height="82" rx="5" class="header" />
    <line x1="1880" y1="533" x2="2440" y2="533" stroke="#475569" stroke-width="2" />
    <text x="2160.0" y="484" class="name" text-anchor="middle">Tool</text>
    <text x="2160.0" y="513" class="stereo" text-anchor="middle">&lt;&lt;owner-scoped interface&gt;&gt;</text>
    <text x="1906" y="566" class="member" text-anchor="start">+ create / enable / disable / drop</text>
    <text x="1906" y="597" class="member" text-anchor="start">+ setAttribute / setAttributes</text>
    <text x="1906" y="628" class="member" text-anchor="start">+ describe() : String (JSON)</text>
    <text x="1906" y="659" class="member" text-anchor="start">+ run(String) : ToolRunResult</text>
    <text x="1906" y="690" class="member" text-anchor="start">+ name / description / status</text>
    <text x="1906" y="721" class="member" text-anchor="start">+ getToolAttributes() : ToolAttributes</text>
    <text x="1906" y="752" class="section" text-anchor="start">Configuration</text>
    <text x="1906" y="783" class="member" text-anchor="start">ToolType / ToolParams / ToolInput</text>
    <text x="1906" y="830" class="note" text-anchor="start">Built-in or custom function configuration.</text>
  </g>
  <path d="M880 290 H1060" class="association" />
  <text x="970" y="271" class="label" text-anchor="middle">references</text>
  <path d="M880 570 H970 V870 H1060" class="association" />
  <text x="970" y="906" class="label" text-anchor="middle">pairs with</text>
  <path d="M1700 310 H1790 V570 H1880" class="dependency" />
  <text x="1790" y="600" class="label" text-anchor="middle">tools by name</text>
  <path d="M1700 900 H1790 V730 H1880" class="dependency" />
  <text x="1790" y="928" class="label" text-anchor="middle">tools by name</text>
  <g class="node" data-name="Client discovery">
    <rect x="60" y="880" width="820" height="306" rx="6" class="box" />
    <rect x="61" y="881" width="818" height="82" rx="5" class="header" />
    <line x1="60" y1="963" x2="880" y2="963" stroke="#475569" stroke-width="2" />
    <text x="470.0" y="914" class="name" text-anchor="middle">Client discovery</text>
    <text x="470.0" y="943" class="stereo" text-anchor="middle">&lt;&lt;SelectAIAgent collection APIs&gt;&gt;</text>
    <text x="86" y="996" class="member" text-anchor="start">listAgents / listTasks / listTools / listTeams</text>
    <text x="86" y="1027" class="member" text-anchor="start">    -&gt; owned, mutable resource handles</text>
    <text x="86" y="1058" class="member" text-anchor="start">listAvailableTeams() -&gt; List&lt;AvailableTeam&gt;</text>
    <text x="86" y="1089" class="member" text-anchor="start">    -&gt; read-only discovery, including shared teams</text>
    <text x="86" y="1136" class="note" text-anchor="start">Shared runs and state calls use the top-level client</text>
    <text x="86" y="1162" class="note" text-anchor="start">with an owner-qualified team name and conversation ID.</text>
  </g>
  <line x1="60" x2="2440" y1="1231" y2="1231" stroke="#cbd5e1" />
  <text x="60" y="1265" class="note" text-anchor="start">Relationships are database names in attribute models, not Java object ownership or inheritance.</text>
  <text x="60" y="1292" class="note" text-anchor="start">Lifecycle factories can load existing resources or retain creation configuration until create() is called.</text>
  <text x="60" y="1319" class="note" text-anchor="start">TeamRunResult and ToolRunResult retain original text/JSON through getRawValue(); TeamDescription.skills is JSON text.</text>
  <text x="60" y="1346" class="note" text-anchor="start">All four resource interfaces expose String, boolean, Integer, and Float setAttribute overloads plus typed setAttributes.</text>
  <text x="60" y="1373" class="note" text-anchor="start">Database/JDBC failures use SelectAIException; invalid arguments and invalid handle state use unchecked exceptions.</text>
</svg>