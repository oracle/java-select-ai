<svg xmlns="http://www.w3.org/2000/svg" width="2360" role="img" aria-labelledby="title desc" height="1748" viewBox="0 0 2360 1748">
  <title id="title">Team Class Diagram</title>
  <desc id="desc">com.oracle.database.selectai.agent.Team | complete public method signatures</desc>
  <defs>
    <style>
            .title {font:700 32px Arial,sans-serif;fill:#17212b}
            .subtitle {font:18px Arial,sans-serif;fill:#475569}
            .box {fill:#fafbfc;stroke:#475569;stroke-width:2}
            .header {fill:#e6edf3}
            .name {font:700 23px Arial,sans-serif;fill:#17212b}
            .stereo,.note,.label {font:18px Arial,sans-serif;fill:#374151}
            .member {font:18px Menlo,Consolas,monospace;fill:#17212b;white-space:pre}
            .section {font:700 18px Arial,sans-serif;fill:#18665c}
            .dependency {fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#arrow)}
            .realization {fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:8 5;marker-end:url(#triangle)}
            .inheritance {fill:none;stroke:#475569;stroke-width:2;marker-end:url(#triangle)}
            .association {fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
        </style>
