      <path d="M1,1 L10,5 L1,9" fill="none" stroke="#475569" stroke-width="2" />
    </marker>
    <marker id="triangle" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M17,9 L1,1 L1,17 Z" fill="#fff" stroke="#475569" stroke-width="2" />
