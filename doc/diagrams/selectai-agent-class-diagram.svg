    <text x="1880.0" y="323" class="stereo" text-anchor="middle">&lt;&lt;interface; right half of the same contract&gt;&gt;</text>
    <text x="1346" y="376" class="section" text-anchor="start">AVAILABLE-TEAM DISCOVERY</text>
