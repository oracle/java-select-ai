  <text x="2180" y="247" class="label" text-anchor="middle">extends</text>
  <g class="node" data-name="DefaultSelectAIAgent">
    <rect x="60" y="1216" width="1120" height="270" rx="6" class="box" />
    <rect x="61" y="1217" width="1118" height="82" rx="5" class="header" />
    <line x1="60" y1="1299" x2="1180" y2="1299" stroke="#475569" stroke-width="2" />
    <text x="620.0" y="1250" class="name" text-anchor="middle">DefaultSelectAIAgent</text>
    <text x="620.0" y="1279" class="stereo" text-anchor="middle">&lt;&lt;package-private, final implementation&gt;&gt;</text>
    <text x="86" y="1332" class="member" text-anchor="start">ConnectionProvider / AgentJdbc / AgentSql</text>
    <text x="86" y="1363" class="member" text-anchor="start">DbConnectionConfig / DataSource / SelectAIOptions</text>
    <text x="86" y="1410" class="note" text-anchor="start">DbConnectionConfig: one SDK-owned connection; close() releases it.</text>
    <text x="86" y="1436" class="note" text-anchor="start">DataSource: borrow/close per operation; the application owns the source.</text>
    <text x="86" y="1462" class="note" text-anchor="start">One operation may use a different pooled session from the next.</text>
  </g>
  <path d="M620 1216 V1116" class="realization" />
  <text x="715" y="1168" class="label" text-anchor="middle">implements</text>
  <g class="node" data-name="Discovery and workflow contracts">
    <rect x="1320" y="1216" width="1120" height="358" rx="6" class="box" />
    <rect x="1321" y="1217" width="1118" height="82" rx="5" class="header" />
    <line x1="1320" y1="1299" x2="2440" y2="1299" stroke="#475569" stroke-width="2" />
    <text x="1880.0" y="1250" class="name" text-anchor="middle">Discovery and workflow contracts</text>
    <text x="1880.0" y="1279" class="stereo" text-anchor="middle">&lt;&lt;public model dependencies&gt;&gt;</text>
    <text x="1346" y="1332" class="member" text-anchor="start">AvailableTeam : teamName / description / rawJson</text>
    <text x="1346" y="1363" class="member" text-anchor="start">RunTeamRequest / RunTeamParams -&gt; TeamRunResult</text>
    <text x="1346" y="1394" class="member" text-anchor="start">ExecutionStateRequest / ExecutionStateParams</text>
    <text x="1346" y="1425" class="member" text-anchor="start">TeamExecutionState / ImportTeamRequest / AgentObjectType</text>
    <text x="1346" y="1472" class="note" text-anchor="start">listTeams(): owned, mutable Team handles; listAvailableTeams(): read-only discovery.</text>
    <text x="1346" y="1498" class="note" text-anchor="start">Available teams include granted shared teams; discovery does not confer ownership.</text>
    <text x="1346" y="1524" class="note" text-anchor="start">State read/update operations require the explicit workflow conversation ID.</text>
    <text x="1346" y="1550" class="note" text-anchor="start">Runtime get/setVariable calls use session state, not durable cross-session storage.</text>
  </g>
  <path d="M1880 992 V1216" class="dependency" />
  <text x="1945" y="1192" class="label" text-anchor="middle">uses</text>
  <line x1="60" x2="2440" y1="1619" y2="1619" stroke="#cbd5e1" />
  <text x="60" y="1653" class="note" text-anchor="start">The two top method compartments represent one interface, not two types. String factory arguments are name and description.</text>
  <text x="60" y="1680" class="note" text-anchor="start">Use SelectAIAgent or Team for team-owner grants; DatabaseAdmin does not expose team-sharing methods.</text>
  <text x="60" y="1707" class="note" text-anchor="start">Database/JDBC failures: SelectAIException. Invalid input/state: unchecked exceptions. Exception clauses omitted.</text>
</svg>