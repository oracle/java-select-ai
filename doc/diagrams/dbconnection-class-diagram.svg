<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">DbConnection class diagram</title>
<desc id="desc">Class diagram for com.oracle.database.selectai.DbConnection and internal DefaultDbConnection</desc>
<style>
  .bg { fill: #ffffff; }
  .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
  .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #4b5563; }
  .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
  .header { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
  .name { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
  .stereo { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
  .member { font: 15px "Menlo", "Consolas", monospace; fill: #111827; }
  .section { stroke: #94a3b8; stroke-width: 1; }
  .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .impl { stroke: #1f2937; stroke-width: 2; fill: none; stroke-dasharray: 8 5; marker-end: url(#triangle); }
  .label { font: 14px Arial, Helvetica, sans-serif; fill: #374151; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
  </marker>
  <marker id="triangle" markerWidth="13" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M12,6 L1,12 L1,0 z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6" />
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="720" />
<text class="title" x="40" y="48">DbConnection Class Diagram</text>
  <text class="subtitle" x="40" y="76">com.oracle.database.selectai.DbConnection public factory and JDBC-backed implementation</text>

<!-- DbConnection interface -->
<g transform="translate(70 155)">
  <rect class="box" x="0" y="0" width="390" height="280" />
  <path class="header" d="M8 0 H382 Q390 0 390 8 V76 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="195" y="31" text-anchor="middle">DbConnection</text>
  <text class="stereo" x="195" y="55" text-anchor="middle">&lt;&lt;interface&gt;&gt; extends AutoCloseable</text>
  <line class="section" x1="0" y1="76" x2="390" y2="76" />
  <text class="member" x="20" y="112">+ create(DbConnectionConfig) : DbConnection</text>
  <text class="member" x="20" y="144">+ getJdbcUrl() : String</text>
  <text class="member" x="20" y="176">+ getDbUser() : String</text>
  <text class="member" x="20" y="208">+ getConnection() : Connection</text>
  <text class="member" x="20" y="240">+ close() : void</text>
</g>

<!-- DefaultDbConnection implementation -->
<g transform="translate(560 120)">
  <rect class="box" x="0" y="0" width="430" height="390" />
  <path class="header" d="M8 0 H422 Q430 0 430 8 V70 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="215" y="30" text-anchor="middle">DefaultDbConnection</text>
  <text class="stereo" x="215" y="53" text-anchor="middle">internal JDBC-backed implementation</text>
  <line class="section" x1="0" y1="70" x2="430" y2="70" />
  <text class="member" x="20" y="103">- jdbcUrl : String</text>
  <text class="member" x="20" y="132">- dbUser : String</text>
  <text class="member" x="20" y="161">- connection : Connection</text>
  <line class="section" x1="0" y1="216" x2="430" y2="216" />
  <text class="member" x="20" y="250">~ builder() : Builder</text>
  <text class="member" x="20" y="279">+ getJdbcUrl() : String</text>
  <text class="member" x="20" y="308">+ getDbUser() : String</text>
  <text class="member" x="20" y="337">+ getConnection() : Connection</text>
  <text class="member" x="20" y="366">+ close() : void</text>
</g>

<!-- Builder -->
<g transform="translate(680 565)">
  <rect class="box" x="0" y="0" width="520" height="154" />
  <path class="header" d="M8 0 H512 Q520 0 520 8 V48 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="260" y="30" text-anchor="middle">DefaultDbConnection.Builder</text>
  <text class="stereo" x="260" y="44" text-anchor="middle">internal</text>
  <line class="section" x1="0" y1="48" x2="520" y2="48" />
  <text class="member" x="20" y="78">~ jdbcUrl(String), dbUser(String)</text>
  <text class="member" x="20" y="106">~ dbPassword(String), walletPassword(String)</text>
  <text class="member" x="20" y="134">~ build() : DbConnection</text>
</g>

<!-- Exception -->
<g transform="translate(70 500)">
  <rect class="box" x="0" y="0" width="330" height="96" />
  <path class="header" d="M8 0 H322 Q330 0 330 8 V52 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="165" y="31" text-anchor="middle">SelectAIException</text>
