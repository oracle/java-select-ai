<svg xmlns="http://www.w3.org/2000/svg" width="3300" height="980" viewBox="0 0 3300 980" role="img" aria-labelledby="title desc">
<title id="title">Profile Provider class diagram clean v5</title>
<desc id="desc">Wide clean class diagram with Profile interface methods and minimized connector overlap</desc>
<style>
.bg{fill:#fff}.title{font:700 32px Arial,Helvetica,sans-serif;fill:#111827}.subtitle{font:17px Arial,Helvetica,sans-serif;fill:#4b5563}
.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}.header{fill:#e2e8f0;stroke:#334155;stroke-width:2}.name{font:700 18px Arial,Helvetica,sans-serif;fill:#0f172a}.stereo{font:13px Arial,Helvetica,sans-serif;fill:#475569}.member{font:14px Menlo,Consolas,monospace;fill:#111827}.section{stroke:#94a3b8;stroke-width:1}
.arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}.inherit{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#triangle)}.assoc{stroke:#1f2937;stroke-width:2;fill:none;marker-start:url(#diamond);marker-end:url(#arrow)}.bus{stroke:#64748b;stroke-width:2;fill:none}.label{font:14px Arial,Helvetica,sans-serif;fill:#374151}
.noteBox{fill:#fefce8;stroke:#ca8a04;stroke-width:1.5;rx:8}.note{font:15px Arial,Helvetica,sans-serif;fill:#713f12}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/></marker>
<marker id="triangle" markerWidth="13" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M12,6 L1,12 L1,0 z" fill="#fff" stroke="#1f2937" stroke-width="1.6"/></marker>
<marker id="diamond" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,6 L8,1 L15,6 L8,11 z" fill="#fff" stroke="#1f2937" stroke-width="1.5"/></marker>
</defs>
<rect class="bg" width="3300" height="980"/>
<text class="title" x="50" y="52">Profile and ProviderProfile Class Diagram</text>
<text class="subtitle" x="50" y="82">Wide layout: Profile interface methods, shared provider fields, compact provider subclasses, minimized connector overlap</text>
<g transform="translate(70 130)"><rect class="box" x="0" y="0" width="500" height="328"/><path class="header" d="M8 0 H492 Q500 0 500 8 V62 H0 V8 Q0 0 8 0 Z"/><text class="name" x="250" y="29" text-anchor="middle">Profile</text><text class="stereo" x="250" y="51" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text><line class="section" x1="0" y1="62" x2="500" y2="62"/><text class="member" x="18" y="114">+ create() : boolean</text><text class="member" x="18" y="162">+ drop(boolean force) : boolean</text><text class="member" x="18" y="186">+ generate(String prompt, GenerateAction action) : String</text><text class="member" x="18" y="210">+ setAttributes(ProfileAttributes attributes) : boolean</text><text class="member" x="18" y="234">+ getProfileAttributes() : ProfileAttributes</text><text class="member" x="18" y="258">+ getProfileName() : String</text><text class="member" x="18" y="282">+ getStatus() : String</text><text class="member" x="18" y="306">+ getDescription() : String</text></g>
<g transform="translate(720 130)"><rect class="box" x="0" y="0" width="570" height="392"/><path class="header" d="M8 0 H562 Q570 0 570 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="285" y="29" text-anchor="middle">ProfileAttributes</text><line class="section" x1="0" y1="48" x2="570" y2="48"/><text class="member" x="18" y="76">- credentialName : String</text><text class="member" x="18" y="100">- provider : String</text><text class="member" x="18" y="124">- providerEndpoint : String</text><text class="member" x="18" y="148">- region : String</text><text class="member" x="18" y="172">- model : String</text><text class="member" x="18" y="196">- embeddingModel : String</text><text class="member" x="18" y="220">- azureDeploymentName : String</text><text class="member" x="18" y="244">- azureEmbeddingDeploymentName : String</text><text class="member" x="18" y="268">- azureResourceName : String</text><text class="member" x="18" y="292">- ociApiformat : String</text><text class="member" x="18" y="316">- ociCompartmentId : String</text><text class="member" x="18" y="340">- ociEndpointId : String</text><text class="member" x="18" y="364">- ociRuntimetype : String</text></g>
<g transform="translate(1460 130)"><rect class="box" x="0" y="0" width="520" height="200"/><path class="header" d="M8 0 H512 Q520 0 520 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="260" y="29" text-anchor="middle">ProviderProfile</text><line class="section" x1="0" y1="48" x2="520" y2="48"/><text class="member" x="18" y="76">- embeddingModel : String</text><text class="member" x="18" y="100">- model : String</text><text class="member" x="18" y="124">- providerName : Provider</text><text class="member" x="18" y="148">- providerEndpoint : String</text><text class="member" x="18" y="172">- region : String</text></g>
<g transform="translate(2140 160)"><rect class="box" x="0" y="0" width="230" height="286"/><path class="header" d="M8 0 H222 Q230 0 230 8 V62 H0 V8 Q0 0 8 0 Z"/><text class="name" x="115" y="29" text-anchor="middle">Provider</text><text class="stereo" x="115" y="51" text-anchor="middle">&lt;&lt;enum&gt;&gt;</text><line class="section" x1="0" y1="62" x2="230" y2="62"/><text class="member" x="18" y="90">openai</text><text class="member" x="18" y="114">cohere</text><text class="member" x="18" y="138">azure</text><text class="member" x="18" y="162">oci</text><text class="member" x="18" y="186">google</text><text class="member" x="18" y="210">anthropic</text><text class="member" x="18" y="234">huggingface</text><text class="member" x="18" y="258">aws</text></g>
<rect class="noteBox" x="2460" y="160" width="740" height="92"/>
<text class="note" x="2485" y="192">Methods are shown only on the Profile interface.</text>
<text class="note" x="2485" y="222">Provider subclasses show only fields declared directly on those classes.</text>
<g transform="translate(70 700)"><rect class="box" x="0" y="0" width="380" height="152"/><path class="header" d="M8 0 H372 Q380 0 380 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="190" y="29" text-anchor="middle">AzureProviderProfile</text><line class="section" x1="0" y1="48" x2="380" y2="48"/><text class="member" x="18" y="76">- azureDeploymentName : String</text><text class="member" x="18" y="100">- azureEmbeddingDeploymentName : String</text><text class="member" x="18" y="124">- azureResourceName : String</text></g>
<g transform="translate(500 700)"><rect class="box" x="0" y="0" width="390" height="176"/><path class="header" d="M8 0 H382 Q390 0 390 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="195" y="29" text-anchor="middle">OCIGenAIProviderProfile</text><line class="section" x1="0" y1="48" x2="390" y2="48"/><text class="member" x="18" y="76">- ociApiFormat : String</text><text class="member" x="18" y="100">- ociCompartmentId : String</text><text class="member" x="18" y="124">- ociEndpointId : String</text><text class="member" x="18" y="148">- ociRuntimeType : String</text></g>
<g transform="translate(940 700)"><rect class="box" x="0" y="0" width="285" height="104"/><path class="header" d="M8 0 H277 Q285 0 285 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="142.5" y="29" text-anchor="middle">AWSProviderProfile</text><line class="section" x1="0" y1="48" x2="285" y2="48"/><text class="member" x="18" y="76">- awsApiFormat : String</text></g>
<g transform="translate(1275 700)"><rect class="box" x="0" y="0" width="280" height="60"/><path class="header" d="M8 0 H272 Q280 0 280 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="140" y="29" text-anchor="middle">OpenAIProviderProfile</text><line class="section" x1="0" y1="48" x2="280" y2="48"/></g>
<g transform="translate(1605 700)"><rect class="box" x="0" y="0" width="280" height="60"/><path class="header" d="M8 0 H272 Q280 0 280 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="140" y="29" text-anchor="middle">CohereProviderProfile</text><line class="section" x1="0" y1="48" x2="280" y2="48"/></g>
<g transform="translate(1935 700)"><rect class="box" x="0" y="0" width="280" height="60"/><path class="header" d="M8 0 H272 Q280 0 280 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="140" y="29" text-anchor="middle">GoogleProviderProfile</text><line class="section" x1="0" y1="48" x2="280" y2="48"/></g>
<g transform="translate(2265 700)"><rect class="box" x="0" y="0" width="330" height="60"/><path class="header" d="M8 0 H322 Q330 0 330 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="165" y="29" text-anchor="middle">HuggingFaceProviderProfile</text><line class="section" x1="0" y1="48" x2="330" y2="48"/></g>
<g transform="translate(2645 700)"><rect class="box" x="0" y="0" width="310" height="60"/><path class="header" d="M8 0 H302 Q310 0 310 8 V48 H0 V8 Q0 0 8 0 Z"/><text class="name" x="155" y="29" text-anchor="middle">AnthropicProviderProfile</text><line class="section" x1="0" y1="48" x2="310" y2="48"/></g>
