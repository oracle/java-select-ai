<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1560" viewBox="0 0 1560 1560" role="img" aria-labelledby="title desc">
<title id="title">Credential class diagram</title>
<desc id="desc">Class diagram for com.oracle.database.selectai.Credential, DefaultCredential, and CredentialConfig with username/password and OCI key credential support.</desc>
<style>
  .bg { fill: #ffffff; }
  .title { font: 700 29px Arial, Helvetica, sans-serif; fill: #111827; }
  .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #4b5563; }
  .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; rx: 8; }
  .header { fill: #e2e8f0; stroke: #334155; stroke-width: 2.5; }
  .name { font: 700 19px Arial, Helvetica, sans-serif; fill: #0f172a; }
  .stereo { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
  .member { font: 15px "Menlo", "Consolas", monospace; fill: #111827; }
  .small { font: 14px "Menlo", "Consolas", monospace; fill: #111827; }
  .section { stroke: #94a3b8; stroke-width: 1.2; }
  .arrow { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  .impl { stroke: #1f2937; stroke-width: 2.2; fill: none; stroke-dasharray: 8 5; marker-end: url(#triangle); }
  .diamond { stroke: #1f2937; stroke-width: 2.2; fill: #ffffff; marker-start: url(#diamond); }
  .labelBox { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 5; }
  .label { font: 700 13px Arial, Helvetica, sans-serif; fill: #475569; }
  .note { fill: #fff7ed; stroke: #f97316; stroke-width: 1.8; rx: 8; }
  .noteText { font: 15px Arial, Helvetica, sans-serif; fill: #9a3412; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
  </marker>
  <marker id="triangle" markerWidth="13" markerHeight="13" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M12,6 L1,12 L1,0 z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6" />
  </marker>
  <marker id="diamond" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M1,6 L8,1 L15,6 L8,11 z" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" />
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="1560" height="1560" />
<text class="title" x="42" y="48">Credential Class Diagram</text>
<text class="subtitle" x="42" y="76">com.oracle.database.selectai.Credential with DBMS_CLOUD username/password and OCI signing-key support</text>

<!-- Credential interface -->
<g transform="translate(70 140)">
  <rect class="box" x="0" y="0" width="360" height="240" />
  <path class="header" d="M8 0 H352 Q360 0 360 8 V76 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="180" y="31" text-anchor="middle">Credential</text>
  <text class="stereo" x="180" y="55" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <line class="section" x1="0" y1="76" x2="360" y2="76" />
  <text class="member" x="22" y="116">+ create() : boolean</text>
  <text class="member" x="22" y="146">+ drop() : boolean</text>
  <text class="member" x="22" y="176">+ drop(boolean) : boolean</text>
</g>

<!-- DefaultCredential implementation -->
<g transform="translate(520 115)">
  <rect class="box" x="0" y="0" width="520" height="390" />
  <path class="header" d="M8 0 H512 Q520 0 520 8 V70 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="260" y="30" text-anchor="middle">DefaultCredential</text>
  <text class="stereo" x="260" y="53" text-anchor="middle">DBMS_CLOUD-backed implementation</text>
  <line class="section" x1="0" y1="70" x2="520" y2="70" />
  <text class="member" x="20" y="106">- connectionProvider : ConnectionProvider</text>
  <text class="member" x="20" y="136">- credentialConfig : CredentialConfig</text>
  <line class="section" x1="0" y1="165" x2="520" y2="165" />
  <text class="member" x="20" y="199">+ create() : boolean</text>
  <text class="member" x="20" y="228">+ drop() : boolean</text>
  <text class="member" x="20" y="257">+ drop(boolean) : boolean</text>
  <line class="section" x1="0" y1="335" x2="520" y2="335" />
  <text class="small" x="20" y="363">create() maps directly to DBMS_CLOUD.CREATE_CREDENTIAL</text>
</g>

<!-- CredentialConfig -->
<g transform="translate(70 560)">
  <rect class="box" x="0" y="0" width="520" height="350" />
  <path class="header" d="M8 0 H512 Q520 0 520 8 V50 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="260" y="31" text-anchor="middle">CredentialConfig</text>
  <line class="section" x1="0" y1="50" x2="520" y2="50" />
  <text class="member" x="20" y="82">- credentialName : String</text>
  <text class="member" x="20" y="111">- username : String</text>
  <text class="member" x="20" y="140">- password : String</text>
  <text class="member" x="20" y="169">- userOcid : String</text>
  <text class="member" x="20" y="198">- tenancyOcid : String</text>
  <text class="member" x="20" y="227">- privateKey : String</text>
  <text class="member" x="20" y="256">- fingerprint : String</text>
  <line class="section" x1="0" y1="280" x2="520" y2="280" />
  <text class="member" x="20" y="309">+ builder(String) : Builder</text>
  <text class="member" x="20" y="338">+ getUsername(), getPassword(), getUserOcid(), ...</text>
</g>

<!-- CredentialConfig Builder -->
<g transform="translate(720 650)">
  <rect class="box" x="0" y="0" width="640" height="275" />
  <path class="header" d="M8 0 H632 Q640 0 640 8 V48 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="320" y="30" text-anchor="middle">CredentialConfig.Builder</text>
  <line class="section" x1="0" y1="48" x2="640" y2="48" />
  <text class="member" x="20" y="80">- credentialName : String</text>
  <text class="member" x="20" y="109">- username/password : String</text>
  <text class="member" x="20" y="138">- userOcid/tenancyOcid/privateKey/fingerprint : String</text>
  <line class="section" x1="0" y1="162" x2="640" y2="162" />
  <text class="member" x="20" y="194">+ username(String) : Builder</text>
  <text class="member" x="20" y="223">+ password(String) : Builder</text>
  <text class="member" x="20" y="252">+ userOcid(), tenancyOcid(), privateKey(), fingerprint(), build()</text>
</g>

<!-- ConnectionProvider -->
<g transform="translate(1115 145)">
  <rect class="box" x="0" y="0" width="350" height="122" />
  <path class="header" d="M8 0 H342 Q350 0 350 8 V58 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="175" y="29" text-anchor="middle">ConnectionProvider</text>
  <text class="stereo" x="175" y="50" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <line class="section" x1="0" y1="58" x2="350" y2="58" />
  <text class="member" x="18" y="92">+ withConnection(callback) : T</text>
</g>

<!-- SelectAIException -->
<g transform="translate(1115 330)">
  <rect class="box" x="0" y="0" width="350" height="94" />
  <path class="header" d="M8 0 H342 Q350 0 350 8 V52 H0 V8 Q0 0 8 0 Z" />
  <text class="name" x="175" y="31" text-anchor="middle">SelectAIException</text>
  <text class="stereo" x="175" y="74" text-anchor="middle">database operation failure</text>
</g>

<!-- Creation modes note -->
<g transform="translate(675 945)">
  <rect class="note" x="0" y="0" width="760" height="54" />
  <text class="noteText" x="24" y="34">create() selects username/password or OCI signing-key overload from CredentialConfig.</text>
</g>

